name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  shell-quality:
    name: Shell quality
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install ShellCheck
        run: |
          sudo apt-get update
          sudo apt-get install --yes shellcheck

      - name: Run checks
        run: make check
