# Continuous integration workflow for Bash and PowerShell.
name: CI
description: Run linting and integration tests for Bash and PowerShell scripts.

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  bash-lint:
    name: Bash lint
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install ShellCheck
        run: |
          sudo apt-get update
          sudo apt-get install --yes shellcheck

      - name: Run ShellCheck
        run: make lint

  bash-test:
    name: Bash integration tests
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Run Bash integration tests
        run: make test

  powershell:
    name: PowerShell lint and tests
    runs-on: windows-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install PSScriptAnalyzer
        shell: pwsh
        run: Install-Module PSScriptAnalyzer -Scope CurrentUser -Force -Repository PSGallery

      - name: Run PSScriptAnalyzer
        shell: pwsh
        run: |
          $results = @(Invoke-ScriptAnalyzer -Path ./bin/upload-to-s3.ps1 -Severity Warning,Error)
          $results | Format-Table -AutoSize
          if ($results.Count -gt 0) {
            throw "PSScriptAnalyzer found $($results.Count) issue(s)."
          }

      - name: Run PowerShell integration tests
        shell: pwsh
        run: ./tests/upload-to-s3-powershell-test.ps1
